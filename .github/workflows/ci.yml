name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SITE_ROOT: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install "uv>=0.9,<0.10"
        uv pip install --system \
          -e ./_refs/ai-parrot/packages/ai-parrot \
          -e "./_refs/ai-parrot/packages/ai-parrot-tools[git,docker,sandbox,codeinterpreter,db]" \
          "pytest>=8"
        uv pip install --system --no-deps -e .
    - name: Prepare test environment
      run: |
        mkdir -p env/dev
        touch env/dev/.env
        ln -s _refs/ai-parrot/templates templates
    - name: Run tests
      run: python -m pytest -q
    - name: Dry run smoke test
      run: |
        python -m multicoders --dry-run "Hello World test"
